name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK; AGP downloads any missing platform itself.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.1.0-build${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace -PappVersionName=${{ steps.ver.outputs.name }} -PappVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/vlc-interface-${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-interface-${{ steps.ver.outputs.name }}
          path: out/*.apk

      # Every build of main becomes a downloadable test release (the action creates the tag itself).
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: vlc interface ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: out/*.apk
          generate_release_notes: true
